[project]
name = "magisterka"
version = "0.1.0"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "accelerate>=1.15.0",
    "beautifulsoup4>=4.15.0",
    "causal-conv1d>=1.7.0",
    "datasets>=5.1.0",
    "einops>=0.8.2",
    "fasttext>=0.9.3",
    "lxml>=6.1.3",
    "mamba-ssm>=2.3.2.post1",
    "matplotlib>=3.11.2",
    "ninja>=1.13.2",
    "nltk>=3.10.4",
    "numpy>=2.5.4",
    "packaging>=26.3",
    "requests>=2.34.2",
    "setuptools>=84.2.1",
    "torch>=2.14.1",
    "transformers>=5.20.2",
    "wandb>=0.31.0",
    "wheel>=0.48.0",
]

[tool.uv.workspace]
members = [
    "src/magisterka",
]

[tool.uv.sources]
# built locally with -std=c++20 (torch 2.14 headers need it; the PyPI sdists hard-code c++17)
causal-conv1d = { path = "wheels/causal_conv1d-1.7.0-cp312-cp312-linux_x86_64.whl" }
mamba-ssm = { path = "wheels/mamba_ssm-2.3.2.post1-cp312-cp312-linux_x86_64.whl" }

[tool.uv]
environments = ["sys_platform == 'linux'"]
